# ============================================================================
# docker-compose.yml, convenience wrapper for the mllm-repro image.
#
# This service models the SINGLE-MODEL run (one 8-GPU ZeRO-3 world, e.g.
# examples/openr1_qwen25vl7b_gt.sh). It encodes the flags the raw `docker run`
# would need: all GPUs, host IPC, big /dev/shm, credentials via .env, and the
# three runtime bind-mounts (HF cache / data / outputs).
#
#   Co-learn (4+4) does NOT fit one service: it launches two independent
#   `accelerate launch --num_processes 4` worlds on GPUs 0-3 and 4-7 that
#   rendezvous via a shared file dir. Run it EITHER via the co-learn example
#   script inside one container (it starts both worlds itself), OR split into two
#   services each pinned to 4 GPUs (see the commented `mllm-b` stub at the bottom).
#
# Quick start:
#   1. cp .env.example .env   &&  fill in HF_TOKEN (only needed for gated Gemma).
#   2. docker compose up -d           # builds + starts an idle, GPU-ready box
#   3. docker compose exec mllm bash  # then: preprocess data, run an example
#
# Host bind-mount paths are overridable WITHOUT editing this file, export or put
# in .env:  HOST_HF_CACHE, HOST_DATA, HOST_OUTPUTS  (these are compose-only
# interpolation vars and are NOT injected into the container's environment).
# ============================================================================

services:
  mllm:
    build:
      context: .
      dockerfile: Dockerfile
    # Self-documenting tag = stack B (§11.1). Bump only if the stack changes.
    image: mllm-repro:th2.9-cu128-vllm0.11.2

    # Credentials + wandb mode. env_file injects HF_TOKEN / WANDB_API_KEY /
    # WANDB_MODE into the container. Keep ONLY those three in .env, do not add
    # HF_HOME etc. there or it would override the image's in-container paths.
    env_file: .env

    # --gpus all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # (Compose v2.30+ also accepts the shorthand `gpus: all` in place of the
    #  deploy block above; the deploy form works on more Compose versions.)

    # --ipc=host + a large /dev/shm: NCCL / vllm / dataloader shared-memory. With
    # ipc: host the shm_size is effectively the host's, but we set it too so the
    # service still behaves if ipc:host is dropped.
    ipc: host
    shm_size: "32gb"

    # Match the reference `docker run` ulimits (pinned pages + big stack).
    ulimits:
      memlock: -1
      stack: 67108864

    volumes:
      - ${HOST_HF_CACHE:-./cache/hf}:/cache/hf        # HF_HOME (models + datasets)
      - ${HOST_DATA:-./data}:/data                    # preprocessed train set, benchmarks
      - ${HOST_OUTPUTS:-./outputs}:/workspace/work_dirs  # checkpoints + logs

    working_dir: /workspace
    stdin_open: true
    tty: true

    # Default: stay alive so you can `exec` in and drive runs by hand. tini (the
    # image ENTRYPOINT) reaps children. Replace with a real run to auto-start, e.g.:
    #
    #   docker compose run --rm mllm bash -lc \
    #     'MLLM_PRE_DIR=/data/mmr1_8k bash examples/openr1_qwen25vl7b_gt.sh'
    #
    # First-run GPU self-check:
    #   docker compose run --rm mllm python verify.py
    command: ["sleep", "infinity"]

  # --------------------------------------------------------------------------
  # Co-learn worker B (OPTIONAL). Uncomment BOTH this and pin `mllm` above to
  # GPUs 0-3 to run the 4+4 heterogeneous co-learn as two services sharing a
  # rendezvous dir under ./outputs. Prefer the co-learn EXAMPLE SCRIPT unless you
  # specifically need two containers.
  #
  # mllm-b:
  #   image: mllm-repro:th2.9-cu128-vllm0.11.2
  #   env_file: .env
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             device_ids: ["4","5","6","7"]
  #             capabilities: [gpu]
  #   ipc: host
  #   shm_size: "32gb"
  #   ulimits: { memlock: -1, stack: 67108864 }
  #   volumes:
  #     - ${HOST_HF_CACHE:-./cache/hf}:/cache/hf
  #     - ${HOST_DATA:-./data}:/data
  #     - ${HOST_OUTPUTS:-./outputs}:/workspace/work_dirs
  #   working_dir: /workspace
  #   command: ["sleep", "infinity"]
